server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://bomerp-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bomerp-backend
    static_configs:
      - targets: [localhost]
        labels:
          application: bomerp-backend
          __path__: /var/log/bomerp-backend/*.log
