<header class="header">
  <div class="header-left">
    <a routerLink="/alumnos" class="home-link" title="Inicio">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>BomERP</span>
    </a>
  </div>
  <div class="header-right">
    @if (getUserDisplay()) {
      <span class="user-info">{{ getUserDisplay() }}</span>
    }
    <button class="btn btn-ghost" (click)="logout()">Cerrar sesión</button>
  </div>
</header>

<div class="body">
  <aside class="sidebar">
    <nav>
      <a routerLink="/alumnos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Matrícula - Alumnos
      </a>
      <a routerLink="/notas" routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Calificaciones - Notas
      </a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
